# Security headers. The billing app sets these itself (beoftexas
# http\SecurityHeadersMiddleware); nginx adds each one only when the
# response doesn't already have it, so they're never sent twice. nginx
# skips an add_header whose value is empty.
map $upstream_http_x_frame_options $sec_x_frame_options {
    ""      "SAMEORIGIN";
    default "";
}
map $upstream_http_x_content_type_options $sec_x_content_type_options {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_xss_protection $sec_x_xss_protection {
    ""      "1; mode=block";
    default "";
}
map $upstream_http_referrer_policy $sec_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_permissions_policy $sec_permissions_policy {
    ""      "geolocation=(), microphone=(), camera=()";
    default "";
}
map $upstream_http_cross_origin_resource_policy $sec_cross_origin_resource_policy {
    ""      "same-origin";
    default "";
}
map $upstream_http_content_security_policy $sec_content_security_policy {
    ""      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://strapi.beoftexas.com;";
    default "";
}

server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Don't advertise the nginx version, and serve the app's own 404 page
    # (beoftexas #199/#407).
    server_tokens off;
    error_page 404 /404.php;

    # Security headers (see the maps above). add_header in a location
    # block replaces these, so the static-files location repeats them.
    add_header X-Frame-Options $sec_x_frame_options always;
    add_header X-Content-Type-Options $sec_x_content_type_options always;
    add_header X-XSS-Protection $sec_x_xss_protection always;
    add_header Referrer-Policy $sec_referrer_policy always;
    add_header Permissions-Policy $sec_permissions_policy always;
    add_header Cross-Origin-Resource-Policy $sec_cross_origin_resource_policy always;
    add_header Content-Security-Policy $sec_content_security_policy always;

    # Serve static files directly
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Must repeat the security headers (see above)
        add_header X-Frame-Options $sec_x_frame_options always;
        add_header X-Content-Type-Options $sec_x_content_type_options always;
        add_header X-XSS-Protection $sec_x_xss_protection always;
        add_header Referrer-Policy $sec_referrer_policy always;
        add_header Permissions-Policy $sec_permissions_policy always;
        add_header Cross-Origin-Resource-Policy $sec_cross_origin_resource_policy always;
        try_files $uri =404;
    }

    # Serve the file or directory index; anything else is a 404 rather
    # than a copy of the home page (beoftexas #407)
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM proxy
    location ~ \.php$ {
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI settings
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
