# Fallback security headers for beoftexas.com: added only when the backend's
# response doesn't have them, so they're never sent twice. map variables are
# global to this nginx, hence the prefix.
map $upstream_http_x_frame_options $beoftexas_edge_x_frame_options {
    ""      "SAMEORIGIN";
    default "";
}
map $upstream_http_x_content_type_options $beoftexas_edge_x_content_type_options {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_xss_protection $beoftexas_edge_x_xss_protection {
    ""      "1; mode=block";
    default "";
}
map $upstream_http_referrer_policy $beoftexas_edge_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_permissions_policy $beoftexas_edge_permissions_policy {
    ""      "geolocation=(), microphone=(), camera=()";
    default "";
}
map $upstream_http_cross_origin_resource_policy $beoftexas_edge_cross_origin_resource_policy {
    ""      "same-origin";
    default "";
}

server {
    listen 80;
    listen [::]:80;

    server_name beoftexas.com www.beoftexas.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://beoftexas.com$request_uri;
    }

    location ^~ /form.php {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name beoftexas.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/beoftexas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beoftexas.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers. HSTS is set here only; the others are a fallback,
    # added only when the backend's response lacks them (see the maps above).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options $beoftexas_edge_x_frame_options always;
    add_header X-Content-Type-Options $beoftexas_edge_x_content_type_options always;
    add_header X-XSS-Protection $beoftexas_edge_x_xss_protection always;
    add_header Referrer-Policy $beoftexas_edge_referrer_policy always;
    add_header Permissions-Policy $beoftexas_edge_permissions_policy always;
    add_header Cross-Origin-Resource-Policy $beoftexas_edge_cross_origin_resource_policy always;

    # Use Docker's internal DNS server for runtime resolution
    resolver 127.0.0.11 valid=10s;

    location / {
        set $backend "beoftexas-web:8000";
        proxy_pass http://$backend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /form.php {
        return 404;
    }
}
