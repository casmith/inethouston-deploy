server {
    listen 80;
    server_name strapi.beoftexas.com;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name strapi.beoftexas.com;

    # Use Docker's internal DNS server for runtime resolution
    resolver 127.0.0.11 valid=10s;

    # Strapi 3.6.5 is end-of-life and unpatched. Until it is replaced, expose
    # only the read-only content the public site uses; the admin panel and
    # every write and plugin route stay blocked.
    set $backend "strapi-web:1337";

    location ~ ^/(menus|articles|file-attachments)(/[0-9]+|/count)?/?$ {
        limit_except GET { deny all; }
        # v3 lets query filters reach private fields through relations
        # (e.g. CVE-2023-22894); the site never sends a query string.
        if ($args != "") { return 403; }
        # Forward the normalized path nginx matched, not the raw one.
        proxy_pass http://$backend$uri;
    }

    location /uploads/ {
        limit_except GET { deny all; }
        proxy_pass http://$backend;
    }

    location = /_health {
        proxy_pass http://$backend;
    }

    location / {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/strapi.beoftexas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strapi.beoftexas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

