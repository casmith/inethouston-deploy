server {
    listen 80;
    server_name strapi.beoftexas.com;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name strapi.beoftexas.com;

    # Use Docker's internal DNS server for runtime resolution
    resolver 127.0.0.11 valid=10s;

    set $strapi5 "strapi5-web:1337";
    set $strapi3 "strapi-web:1337";

    client_max_body_size 64m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Strapi 3 content routes, for beoftexas builds that predate the move
    # to Strapi 5's /api. Read-only: Strapi 3.6.5 is end-of-life. Remove this,
    # and the strapi/ stack, once production beoftexas reads from /api.
    location ~ ^/(menus|articles|file-attachments)(/[0-9]+|/count)?/?$ {
        limit_except GET { deny all; }
        # v3 lets query filters reach private fields through relations
        # (e.g. CVE-2023-22894); the site never sends a query string.
        if ($args != "") { return 403; }
        # Forward the normalized path nginx matched, not the raw one.
        proxy_pass http://$strapi3$uri;
    }

    # Strapi 5: REST API (/api), admin panel (/admin) and uploads
    location / {
        proxy_pass http://$strapi5;
    }

    ssl_certificate /etc/letsencrypt/live/strapi.beoftexas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strapi.beoftexas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

